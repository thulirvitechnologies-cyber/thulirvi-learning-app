name: Build Thulirvi Learn APK

on:
  workflow_dispatch:
  push:
    paths:
      - "thulirvi-learn-android-repaired.zip"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Android project
        run: |
          unzip -o thulirvi-learn-android-repaired.zip -d extracted
          ls -la extracted

      - name: Build release APK
        run: |
          cd extracted/thulirvi-learn-android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: thulirvi-learn-apk
          path: extracted/thulirvi-learn-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
